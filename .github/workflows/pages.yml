name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:booking
      - run: npm run check:types
      # Watermarked references are committed (public/reference + src/content/reference-credits.json);
      # check-images.mjs verifies each one's pixel hash, so CI never re-downloads third-party photos.
      # This repository is the isolated, noindex GitHub staging site.
      # Pin the mode and root path so repository variables cannot attach a real-domain CNAME.
      - run: npm run build
        env:
          SITE_MODE: prototype
          BASE_PATH: /
          PUBLIC_URL: https://chefsergioandco.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
